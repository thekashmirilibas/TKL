<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kashmiri Libas | Kashmiri clothing, kaftans, pherans &amp; more</title>
<meta name="description" content="Handpicked Kashmiri kurtis, kaftans, pherans, shawls, stoles and bags. Choose your pieces and order on WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f3b3a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23e0b25a' font-family='serif'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f3b3a;--teal2:#16524f;--gold:#c9922e;--goldl:#e0b25a;--paper:#f4f6f3;--ink:#14201f;--mute:#5d6b69;--line:#d9dfdb;--crocus:#6b3f7c;--wa:#1fa855;--r:6px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:Marcellus,Georgia,serif;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
header{background:var(--teal);color:#fff;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:14px;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:1.35rem;letter-spacing:.02em;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo small{display:block;font-family:Figtree,sans-serif;font-size:.62rem;letter-spacing:.14em;color:var(--goldl);margin-top:-3px}
.search{flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border-radius:99px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;font:inherit}
.search input::placeholder{color:#ffffffaa}
.cartbtn{position:relative;padding:8px 14px;border:1px solid var(--goldl);border-radius:99px;color:var(--goldl);font-weight:500;white-space:nowrap}
.cartbtn b{background:var(--goldl);color:var(--teal);border-radius:99px;padding:0 7px;margin-left:6px;font-size:.8rem}
nav{border-top:1px solid #ffffff1f;overflow-x:auto;scrollbar-width:none}
nav .wrap{display:flex;gap:4px}
nav a{padding:10px 12px;white-space:nowrap;font-size:.92rem;color:#ffffffcc;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--goldl)}
/* hero */
.hero{background:var(--teal);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding-top:44px;padding-bottom:50px}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.08}
.hero p{margin:16px 0 26px;color:#ffffffcc;max-width:46ch}
.btn{display:inline-block;background:var(--gold);color:#1b1200;padding:12px 22px;border-radius:var(--r);font-weight:600}
.btn:hover{background:var(--goldl)}
.btn.ghost{background:none;border:1px solid #ffffff66;color:#fff;margin-left:8px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:10px;transform:rotate(2deg)}
.mosaic img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);border:3px solid #ffffff22}
.mosaic img:nth-child(2){margin-top:26px}
.mosaic img:nth-child(3){margin-top:-26px}
/* sections */
section{padding:42px 0 6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:10px}
.sh h2{font-size:1.7rem}
.sh a{color:var(--teal2);font-weight:500;font-size:.92rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.cat{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--teal2)}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.cat:hover img{transform:scale(1.05)}
.cat span{position:absolute;inset:auto 0 0 0;padding:34px 12px 12px;background:linear-gradient(transparent,#0a2423e6);color:#fff;font-family:Marcellus,serif;font-size:1.15rem}
.cat span i{display:block;font:normal .78rem Figtree,sans-serif;color:var(--goldl)}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.budget a{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:22px 20px;display:flex;justify-content:space-between;align-items:center;font-family:Marcellus,serif;font-size:1.3rem}
.budget a:hover{border-color:var(--gold)}
.budget small{font:.8rem Figtree,sans-serif;color:var(--mute)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column}
.card .im{position:relative;aspect-ratio:3/4;background:#e4e9e5;border-radius:var(--r);overflow:hidden;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:var(--crocus);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px}
.card h3{font:500 .98rem Figtree,sans-serif;margin:10px 0 2px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mute);font-size:.82rem}
.price{font-weight:600;margin:4px 0 8px}
.card button{margin-top:auto;border:1px solid var(--teal);color:var(--teal);border-radius:var(--r);padding:8px;font-weight:500}
.card button:hover{background:var(--teal);color:#fff}
.card button.in{background:var(--teal);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 18px}
.bar h1{font-size:2rem;margin-right:auto}
.bar select,.bar button{padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:var(--r);font:inherit}
.count{color:var(--mute);font-size:.9rem;width:100%;margin-top:-6px}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
/* drawers */
.ov{position:fixed;inset:0;background:#0a1a1a99;z-index:40;display:none}
.ov.show{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.drawer.show{transform:none}
.drawer header{background:none;color:var(--ink);position:static;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:1.4rem}
.items{flex:1;overflow:auto;padding:6px 18px}
.it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.it img{width:62px;height:82px;object-fit:cover;border-radius:4px}
.it div{flex:1;font-size:.9rem}
.it button{color:#a33;font-size:.82rem}
.foot{padding:16px 18px;border-top:1px solid var(--line)}
.foot .tot{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px}
.wa{display:block;text-align:center;background:var(--wa);color:#fff;padding:13px;border-radius:var(--r);font-weight:600;width:100%}
.wa:hover{filter:brightness(1.08)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.mb{background:#fff;border-radius:10px;max-width:880px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.mb .g img.main{width:100%;aspect-ratio:3/4;object-fit:cover}
.thumbs{display:flex;gap:6px;padding:8px}
.thumbs img{width:58px;height:74px;object-fit:cover;border-radius:4px;cursor:pointer;opacity:.6}
.thumbs img.on{opacity:1;outline:2px solid var(--gold)}
.mb .d{padding:26px 24px}
.mb h2{font-size:1.6rem;margin-bottom:6px}
.mb dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 22px;font-size:.92rem}
.mb dt{color:var(--mute)}
.x{position:absolute;right:10px;top:6px;font-size:1.7rem;z-index:2;background:#fffc;border-radius:50%;width:36px;height:36px}
.mb .d .btn{width:100%;text-align:center;margin-bottom:8px}
footer{background:var(--teal);color:#ffffffcc;margin-top:60px;padding:34px 0;text-align:center;font-size:.9rem}
footer .logo{justify-content:center;color:#fff;margin-bottom:8px}
.fab{position:fixed;right:16px;bottom:16px;background:var(--wa);color:#fff;border-radius:99px;padding:12px 18px;font-weight:600;z-index:15;box-shadow:0 4px 14px #0004}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;z-index:60;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:760px){
.hero .wrap{grid-template-columns:1fr;padding-top:28px}.mosaic{display:none}
.search{order:3;flex-basis:100%;max-width:none}.top{flex-wrap:wrap}.cartbtn{margin-left:auto}
.mb{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:16px 10px}.fab{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <a class="logo" href="#/">
   <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#e0b25a" stroke-width="1.5"/><path d="M20 6c1 4 5 5 5 9 2-1 4-3 4-6 4 5 3 12-1 15 2 0 3-1 4-2-1 5-6 8-12 8s-11-3-12-8c1 1 2 2 4 2-4-3-5-10-1-15 0 3 2 5 4 6 0-4 4-5 5-9z" fill="#e0b25a"/><path d="M20 18v16" stroke="#0f3b3a" stroke-width="1.5"/></svg>
   <span>The Kashmiri Libas<small>HANDPICKED FROM THE VALLEY</small></span>
  </a>
  <div class="search"><input id="q" type="search" placeholder="Search products" aria-label="Search products"></div>
  <button class="cartbtn" id="cartOpen">Enquiry list<b id="cc">0</b></button>
 </div>
 <nav><div class="wrap" id="nav"></div></nav>
</header>

<main id="app"></main>

<footer><div class="wrap">
 <div class="logo">The Kashmiri Libas</div>
 <p>Message us on WhatsApp to confirm availability, price and delivery.</p>
 <p style="margin-top:10px"><a href="#" id="fwa" style="color:var(--goldl)">Chat on WhatsApp</a></p>
</div></footer>

<a class="fab" id="fab" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Enquiry list">
 <header><h2>Your enquiry list</h2><button id="cartClose" aria-label="Close" style="font-size:1.6rem">&times;</button></header>
 <div class="items" id="items"></div>
 <div class="foot"><div class="tot"><span>Total</span><span id="tot"></span></div><a class="wa" id="send" target="_blank" rel="noopener">Send on WhatsApp</a></div>
</aside>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ====== SETTINGS: only change these ====== */
const CONFIG = {
  csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAbptGhYwrqu1yV2P0uqam1bMWGcpPglIYyW_mIUljfbvvWJXBdGPcsluUoxXqM4d5wkR5vT41NVAx/pub?gid=1342573888&single=true&output=csv",   // Google Sheet > File > Share > Publish to web > "Website Products" > CSV
  whatsapp: "919911029922",
  brand: "The Kashmiri Libas"
};
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
const BANDS = {"under-1000":["Under ₹1,000",0,999],"1000-2000":["₹1,000 to ₹2,000",1000,2000],"above-2000":["Above ₹2,000",2001,1e9]};
let P = [], CATS = [], cart = [], view = {q:"", season:"", sub:"", sort:""};

function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==","){ r.push(f); f="" }
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&t[i+1]=="\n") i++; r.push(f); rows.push(r); r=[]; f="" }
    else f+=c;
  }
  if(f||r.length){ r.push(f); rows.push(r) }
  return rows;
}

function build(csv){
  const rows = parseCSV(csv); const h = rows.shift().map(x => x.trim().toLowerCase());
  const col = n => h.indexOf(n);
  const ix = {name:col("product name"),price:col("price"),img:col("image url"),season:col("season"),cat:col("category"),sub:col("subcategory"),size:col("size"),feat:col("featured this summer"),i2:col("image2"),i3:col("image3"),i4:col("image4"),color:col("color"),len:col("length"),id:col("product id")};
  const g = (r,k) => (ix[k]>-1 ? (r[ix[k]]||"").trim() : "");
  P = rows.map((r,n) => {
    const price = parseFloat(g(r,"price").replace(/[^\d.]/g,""));
    return {id:g(r,"id")||("row"+n), name:g(r,"name"), price, season:g(r,"season"), cat:g(r,"cat"), sub:g(r,"sub"), size:g(r,"size"), color:g(r,"color"), len:g(r,"len"),
      feat:g(r,"feat").toUpperCase()=="Y", imgs:["img","i2","i3","i4"].map(k=>g(r,k)).filter(Boolean)};
  }).filter(p => p.name && p.cat && !isNaN(p.price));
  const m = {};
  P.forEach(p => { (m[p.cat] ||= {name:p.cat, slug:slug(p.cat), n:0, img:""}).n++; if(!m[p.cat].img && p.imgs[0]) m[p.cat].img = p.imgs[0]; });
  CATS = Object.values(m).sort((a,b) => b.n-a.n);
}

/* ---------- cart ---------- */
function loadCart(){ try{ cart = JSON.parse(localStorage.getItem("kl_cart")||"[]") }catch(e){ cart=[] } }
function saveCart(){ try{ localStorage.setItem("kl_cart", JSON.stringify(cart)) }catch(e){} }
const inCart = id => cart.includes(id);
function toggle(id){
  const p = P.find(x=>x.id===id); if(!p) return;
  if(inCart(id)){ cart = cart.filter(x=>x!==id); toast("Removed from list") } else { cart.push(id); toast("Added to enquiry list") }
  saveCart(); renderCart(); document.querySelectorAll(`[data-add="${CSS.escape(id)}"]`).forEach(b=>setBtn(b,id));
}
const setBtn = (b,id) => { b.textContent = inCart(id) ? "Added ✓ Remove" : "Add to enquiry"; b.classList.toggle("in", inCart(id)) };
function line(p){ return `${p.name} (${p.id})` + [p.size&&"Size: "+p.size, p.color&&"Colour: "+p.color, p.len&&"Length: "+p.len].filter(Boolean).map(x=>" - "+x).join("") + " - " + inr(p.price) }
const waLink = txt => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`;
function renderCart(){
  const items = cart.map(id=>P.find(p=>p.id===id)).filter(Boolean);
  $("#cc").textContent = items.length;
  $("#items").innerHTML = items.length ? items.map(p=>`<div class="it"><img src="${esc(p.imgs[0]||"")}" alt=""><div><b>${esc(p.name)}</b><div class="meta">${esc([p.size,p.color].filter(Boolean).join(" · "))}</div><div class="price">${inr(p.price)}</div><button data-rm="${esc(p.id)}">Remove</button></div></div>`).join("") : `<p class="empty">Your list is empty.<br>Add products, then send them to us on WhatsApp.</p>`;
  const total = items.reduce((s,p)=>s+p.price,0);
  $("#tot").textContent = inr(total);
  const msg = items.length ? `Hi! I want to order these from ${CONFIG.brand}:\n\n` + items.map((p,i)=>`${i+1}. ${line(p)}`).join("\n") + `\n\nTotal: ${inr(total)}` : "";
  const s = $("#send"); s.href = items.length ? waLink(msg) : "#"; s.style.opacity = items.length ? 1 : .5;
}
function drawer(open){ $("#drawer").classList.toggle("show",open); $("#ov").classList.toggle("show",open) }

/* ---------- views ---------- */
function card(p){
  return `<article class="card"><div class="im" data-open="${esc(p.id)}">${p.feat?'<span class="tag">Featured</span>':""}<img loading="lazy" src="${esc(p.imgs[0]||"")}" alt="${esc(p.name)}"></div>
  <h3 data-open="${esc(p.id)}">${esc(p.name)}</h3><div class="meta">${esc([p.sub,p.size].filter(Boolean).join(" · "))}</div><div class="price">${inr(p.price)}</div>
  <button data-add="${esc(p.id)}">${inCart(p.id)?"Added ✓ Remove":"Add to enquiry"}</button></article>`;
}
function home(){
  const feat = P.filter(p=>p.feat).slice(0,8);
  const pics = (feat.length?feat:P).slice(0,3);
  $("#app").innerHTML = `
  <div class="hero"><div class="wrap"><div>
    <h1>Kashmir, stitched into everything we sell</h1>
    <p>Aari embroidered kaftans, pherans, shawls, kurtis and bags. Pick what you love and send the list to us on WhatsApp.</p>
    <a class="btn" href="#/all">Shop all ${P.length} pieces</a><a class="btn ghost" href="#/featured">Featured</a>
  </div><div class="mosaic">${pics.map(p=>`<img src="${esc(p.imgs[0])}" alt="${esc(p.name)}">`).join("")}</div></div></div>
  <div class="wrap">
  <section><div class="sh"><h2>Shop by category</h2></div><div class="cats">${CATS.map(c=>`<a class="cat" href="#/${c.slug}"><img loading="lazy" src="${esc(c.img)}" alt=""><span>${esc(c.name)}<i>${c.n} pieces</i></span></a>`).join("")}</div></section>
  ${feat.length?`<section><div class="sh"><h2>Featured this summer</h2><a href="#/featured">See all</a></div><div class="grid">${feat.map(card).join("")}</div></section>`:""}
  <section><div class="sh"><h2>Shop by budget</h2></div><div class="budget">${Object.entries(BANDS).map(([k,b])=>`<a href="#/budget-${k}">${b[0]}<small>${P.filter(p=>p.price>=b[1]&&p.price<=b[2]).length} pieces</small></a>`).join("")}</div></section>
  </div>`;
}
function list(key){
  let title="All products", set=P, c;
  if(key==="featured"){ title="Featured this summer"; set=P.filter(p=>p.feat) }
  else if(key.startsWith("budget-")){ const b=BANDS[key.slice(7)]; if(b){ title=b[0]; set=P.filter(p=>p.price>=b[1]&&p.price<=b[2]) } }
  else if(key!=="all" && (c=CATS.find(x=>x.slug===key))){ title=c.name; set=P.filter(p=>p.cat===c.name) }
  const subs=[...new Set(set.map(p=>p.sub).filter(Boolean))].sort(), seasons=[...new Set(set.map(p=>p.season).filter(Boolean))];
  let r = set.filter(p => (!view.season||p.season===view.season) && (!view.sub||p.sub===view.sub) && (!view.q||(p.name+" "+p.cat+" "+p.sub+" "+p.color).toLowerCase().includes(view.q.toLowerCase())));
  if(view.sort==="lo") r=[...r].sort((a,b)=>a.price-b.price); if(view.sort==="hi") r=[...r].sort((a,b)=>b.price-a.price);
  $("#app").innerHTML = `<div class="wrap"><div class="bar"><h1>${esc(title)}</h1>
   ${subs.length>1?`<select id="fs" aria-label="Type"><option value="">All types</option>${subs.map(s=>`<option ${view.sub===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
   ${seasons.length>1?`<select id="fz" aria-label="Season"><option value="">All seasons</option>${seasons.map(s=>`<option ${view.season===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
   <select id="fo" aria-label="Sort"><option value="">Sort: Featured</option><option value="lo" ${view.sort=="lo"?"selected":""}>Price: low to high</option><option value="hi" ${view.sort=="hi"?"selected":""}>Price: high to low</option></select>
   <button id="cp">Copy page link</button><div class="count">${r.length} product${r.length==1?"":"s"}</div></div>
   ${r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<p class="empty">No products match. Try clearing the search or filters.</p>`}</div>`;
  $("#fs")&&($("#fs").onchange=e=>{view.sub=e.target.value;list(key)});
  $("#fz")&&($("#fz").onchange=e=>{view.season=e.target.value;list(key)});
  $("#fo").onchange=e=>{view.sort=e.target.value;list(key)};
  $("#cp").onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>toast("Link copied"),()=>toast("Copy the link from the address bar")) };
}
function route(){
  const key = decodeURIComponent(location.hash.replace(/^#\/?/,"")).toLowerCase();
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#/"+key));
  if(!P.length) return;
  if(key===""&&!view.q) home(); else list(key||"all");
  scrollTo(0,0);
}
function openProduct(id){
  const p=P.find(x=>x.id===id); if(!p) return;
  const rows=[["Category",p.cat],["Type",p.sub],["Season",p.season],["Size",p.size],["Colour",p.color],["Length",p.len],["Product ID",p.id]].filter(x=>x[1]);
  $("#mb").innerHTML = `<button class="x" id="mx" aria-label="Close">&times;</button>
   <div class="g"><img class="main" id="mainimg" src="${esc(p.imgs[0]||"")}" alt="${esc(p.name)}">${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((s,i)=>`<img src="${esc(s)}" class="${i?"":"on"}" alt="">`).join("")}</div>`:""}</div>
   <div class="d"><h2>${esc(p.name)}</h2><div class="price" style="font-size:1.3rem">${inr(p.price)}</div>
   <dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
   <button class="btn" data-add="${esc(p.id)}"></button>
   <a class="btn ghost" style="color:var(--teal);border-color:var(--teal);margin:0;display:block;text-align:center" target="_blank" rel="noopener" href="${waLink(`Hi! I want to order the ${line(p)}`)}">Order this on WhatsApp</a></div>`;
  setBtn($("#mb [data-add]"),id); $("#modal").classList.add("show"); $("#ov").classList.add("show");
  document.querySelectorAll(".thumbs img").forEach(t=>t.onclick=()=>{ $("#mainimg").src=t.src; document.querySelectorAll(".thumbs img").forEach(x=>x.classList.toggle("on",x===t)) });
}
function closeAll(){ $("#modal").classList.remove("show"); drawer(false) }
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600) }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const a=e.target.closest("[data-add]"); if(a){ toggle(a.dataset.add); return }
  const o=e.target.closest("[data-open]"); if(o){ openProduct(o.dataset.open); return }
  const rm=e.target.closest("[data-rm]"); if(rm){ toggle(rm.dataset.rm); return }
  if(e.target.id==="mx"||e.target.id==="ov") closeAll();
});
$("#modal").addEventListener("click", e => { if(e.target.id==="modal") closeAll() });
$("#cartOpen").onclick=()=>drawer(true); $("#cartClose").onclick=()=>drawer(false);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeAll() });
$("#q").addEventListener("input", e => { view.q=e.target.value.trim(); if(location.hash.replace(/^#\/?/,"")==="" && !view.q) home(); else if(!/^#\/./.test(location.hash)) location.hash="#/all"; else route() });
window.addEventListener("hashchange", () => { view.sub=view.season=view.sort=""; route() });
$("#fab").href=$("#fwa").href=waLink("Hi! I'd like to know more about your collection.");

/* ---------- start ---------- */
loadCart();
$("#app").innerHTML = `<p class="empty">Loading collection…</p>`;
(async()=>{
  try{
    if(CONFIG.csv.startsWith("PASTE")) throw new Error("csv");
    const res = await fetch(CONFIG.csv + (CONFIG.csv.includes("?")?"&":"?") + "t=" + Math.floor(Date.now()/60000));
    if(!res.ok) throw new Error("http");
    build(await res.text());
    $("#nav").innerHTML = `<a href="#/all">All</a><a href="#/featured">Featured</a>` + CATS.map(c=>`<a href="#/${c.slug}">${esc(c.name)}</a>`).join("");
    cart = cart.filter(id=>P.some(p=>p.id===id));
    renderCart(); route();
  }catch(err){
    $("#app").innerHTML = `<p class="empty">${err.message==="csv"?"Site setup pending: add the published sheet link in index.html (CONFIG).":"We couldn't load the collection. Please refresh, or message us on WhatsApp."}</p>`;
  }
})();
</script>
</body>
</html>

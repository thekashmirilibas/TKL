<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Kashmiri Libas — Authentic Kashmiri Clothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --bg: #faf5ee;
    --surface: #ffffff;
    --card-bg: #ffffff;
    --border: #e5d9c8;
    --border-dark: #1c0f00;
    --text: #1c0f00;
    --text-muted: #71717a;
    --saffron: #c28833;
    --ruby: #7d1a1a;
    --sage: #3d5e38;
    --radius: 4px;
    --font-serif: 'Cinzel', serif;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --ease: 0.2s ease;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-sans);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    padding: 16px 16px 120px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .editorial-shell {
    width: 100%;
    max-width: 1200px;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  .hidden { display: none !important; }

  /* ZARA / EDITORIAL MASTHEAD */
  .brand-masthead {
    text-align: center;
    padding: 16px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    background: rgba(250, 245, 238, 0.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-logo {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--text);
  }

  .brand-sub {
    font-size: 8.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--saffron);
    font-weight: 600;
    margin-top: 3px;
  }

  /* SEARCH & CONTROLS STRIP */
  .control-grid {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    position: relative;
  }

  .search-box input {
    width: 100%;
    height: 44px;
    padding: 0 12px 0 38px;
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border var(--ease);
  }

  .search-box input:focus { border-color: var(--border-dark); }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 15px;
    width: 14px;
    height: 14px;
    color: var(--text-muted);
  }

  .btn-cart-nav {
    height: 44px;
    padding: 0 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .cart-pill {
    background: var(--ruby);
    color: #fff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 99px;
    font-weight: 700;
  }

  .wa-direct-btn {
    height: 44px;
    padding: 0 16px;
    background: var(--sage);
    color: #fff;
    border-radius: var(--radius);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  /* SEASON PILLS FILTER BAR */
  .filter-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 24px;
    scrollbar-width: none;
  }
  .filter-pills::-webkit-scrollbar { display: none; }

  .f-pill {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    white-space: nowrap;
    transition: all var(--ease);
  }

  .f-pill.on {
    background: var(--border-dark);
    color: #fff;
    border-color: var(--border-dark);
  }

  /* EDITORIAL CATEGORY TILES */
  .edit-section-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 24px 0 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .edit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }

  .edit-tile {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform var(--ease), border-color var(--ease);
  }

  .edit-tile:hover { transform: translateY(-3px); border-color: var(--border-dark); }
  .edit-tile img { opacity: 0.9; transition: transform 0.4s ease; }
  .edit-tile:hover img { transform: scale(1.05); }
  .edit-tile::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(28,15,0,0.85) 100%);
  }
  .edit-tile-meta {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 2; color: #fff;
  }
  .edit-tile-name { font-family: var(--font-serif); font-size: 16px; font-weight: 600; letter-spacing: 1px; }
  .edit-tile-count { font-size: 9px; opacity: 0.75; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  /* CATALOG GRID VIEW */
  .catalog-view { display: none; }
  .catalog-view.visible { display: block; }
  
  .catalog-bar {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .btn-back-catalog {
    height: 38px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }

  .kl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  .kl-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
    transition: transform var(--ease), border-color var(--ease);
  }

  .kl-card:hover { transform: translateY(-3px); border-color: var(--border-dark); }

  .card-media {
    position: relative;
    aspect-ratio: 4 / 5;
    background: #f4f4f5;
    overflow: hidden;
  }

  .card-bag-btn {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border);
    display: grid; place-items: center; transition: all var(--ease);
  }
  .card-bag-btn:hover { background: var(--border-dark); color: #fff; }
  .card-bag-btn.in-bag { background: var(--ruby); color: #fff; border-color: var(--ruby); }
  .card-bag-btn svg { width: 14px; height: 14px; }

  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 3px; flex-grow: 1; }
  .card-cat { font-size: 8.5px; font-weight: 600; color: var(--saffron); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-specs { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin: 2px 0 4px; }
  .card-finance {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: auto; padding-top: 6px; border-top: 1px solid #f8f8f8;
  }
  .card-price { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; color: var(--text); }
  .card-size { font-size: 9px; color: var(--text-muted); }

  /* PRODUCT DETAILS MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(28, 15, 0, 0.5); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    width: min(880px, 100%); max-height: 90vh; background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-close-btn {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: 1px solid var(--border);
    display: grid; place-items: center; cursor: pointer;
  }
  .modal-grid { display: grid; grid-template-columns: 1.1fr 1fr; flex: 1; overflow: hidden; }
  .modal-img-pane { background: #f4f4f5; display: flex; flex-direction: column; position: relative; }
  .modal-main-img { flex: 1; position: relative; min-height: 360px; overflow: hidden; cursor: zoom-in; }
  .modal-thumbs { display: flex; gap: 6px; padding: 10px; background: #fff; border-top: 1px solid var(--border); overflow-x: auto; }
  .m-thumb { width: 50px; height: 60px; border: 1.5px solid transparent; border-radius: var(--radius); overflow: hidden; flex-shrink: 0; opacity: 0.6; cursor: pointer; }
  .m-thumb.on { border-color: var(--border-dark); opacity: 1; }
  .modal-info-pane { padding: 28px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-price { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--text); }

  .btn-action-primary {
    height: 44px; background: var(--border-dark); color: #fff;
    border-radius: var(--radius); font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; width: 100%;
  }
  .btn-action-wa {
    height: 44px; background: #25d366; color: #fff;
    border-radius: var(--radius); font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* CART SLIDE OVER */
  .cart-overlay {
    position: fixed; inset: 0; z-index: 500; background: rgba(28,15,0,0.4);
    opacity: 0.2; pointer-events: none; transition: opacity var(--ease);
  }
  .cart-overlay.open { opacity: 1; pointer-events: auto; }
  .cart-tray {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 501;
    width: min(420px, 100vw); background: #fff; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .cart-overlay.open .cart-tray { transform: translateX(0); }
  .cart-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .cart-items { flex: 1; overflow-y: auto; padding: 14px 20px; }
  .cart-foot { padding: 18px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

  /* LIGHTBOX */
  .lightbox-view {
    position: fixed; inset: 0; z-index: 9000; background: #000; display: none; align-items: center; justify-content: center;
  }
  .lightbox-view.open { display: flex; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 26px; z-index: 9001; cursor: pointer; }

  .toast-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 1000; background: var(--border-dark); color: #fff; padding: 8px 18px;
    border-radius: var(--radius); font-size: 11px; opacity: 0; pointer-events: none; transition: all 0.2s ease;
  }
  .toast-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media(max-width:768px) {
    .modal-grid { grid-template-columns: 1fr; overflow-y: auto; }
    .kl-grid, .edit-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>

<div class="editorial-shell">
  <header class="brand-masthead">
    <div class="brand-logo" id="brandHomeTrigger" style="cursor:pointer;">The Kashmiri Libas</div>
    <div class="brand-sub">Authentic Kashmiri Clothing & Curation</div>
  </header>

  <!-- SEARCH & ACTIONS BAR -->
  <div class="control-grid">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Search catalog by name, material, color..." autocomplete="off"/>
    </div>
    <button class="btn-cart-nav" id="btnOpenCart">
      <span>Bag</span>
      <span class="cart-pill" id="cartCountBadge">0</span>
    </button>
    <a class="wa-direct-btn" href="https://wa.me/919911029922" target="_blank" rel="noopener">WhatsApp</a>
  </div>

  <!-- HOME EDITORIAL VIEW -->
  <div id="homeEditorialView">
    <div class="filter-pills" id="seasonChipsBar"></div>

    <div class="edit-section-title"><span>The Winter Edit</span> <span id="winterCount" style="font-size:11px;color:var(--text-muted);"></span></div>
    <div class="edit-grid" id="winterGrid"></div>

    <div class="edit-section-title"><span>The Summer Edit</span> <span id="summerCount" style="font-size:11px;color:var(--text-muted);"></span></div>
    <div class="edit-grid" id="summerGrid"></div>
  </div>

  <!-- CATEGORY CATALOG VIEW -->
  <div class="catalog-view" id="catalogView">
    <div class="catalog-bar">
      <button class="btn-back-catalog" id="btnBackHome">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        All Collections
      </button>
      <h2 style="font-family:var(--font-serif);font-size:20px;" id="catalogHeaderTitle"></h2>
    </div>
    <div class="kl-grid" id="catalogGrid"></div>
  </div>
</div>

<!-- PRODUCT DETAILS MODAL -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <button class="modal-close-btn" id="modalCloseBtn">✕</button>
    <div class="modal-grid" id="modalGridContent"></div>
  </div>
</div>

<!-- CART TRAY -->
<div class="cart-slide-overlay" id="cartOverlay">
  <div class="cart-tray">
    <div class="cart-head">
      <span style="font-family:var(--font-serif);font-weight:700;text-transform:uppercase;">Your Shopping Bag</span>
      <button id="cartCloseBtn" style="font-size:16px;">✕</button>
    </div>
    <div class="cart-items" id="cartItemsList"></div>
    <div class="cart-foot" id="cartFootBox" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);">Estimated Total</span>
        <span style="font-family:var(--font-mono);font-size:18px;font-weight:700;" id="cartTotalSum">₹0</span>
      </div>
      <input type="text" id="customerNameInput" placeholder="Your Name for WhatsApp Order..." style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;outline:none;"/>
      <button class="btn-action-wa" id="whatsappCheckoutBtn">Send Order via WhatsApp</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-view" id="lightboxView">
  <span class="lightbox-close" id="lightboxCloseBtn">✕</span>
  <img id="lightboxImg" src="" alt="" style="max-width:100%;max-height:100%;object-fit:contain;"/>
</div>

<div class="toast-bar" id="toastBar"></div>

<script>
(function(){
  'use strict';

  const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxXrnuQJigZsfDKQoeDcCH0CwoWS2R6wHauIRYp13dLh7QYEPs6DHwzlS1qDgA0LeYMeA/exec';
  const BLANK_SVG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22500%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23f4f4f5%22%2F%3E%3C%2Fsvg%3E';
  const WA_PHONE = '919911029922';

  let ALL_PRODUCTS = [];
  let ACTIVE_CATEGORY = null;
  let CART = [];
  let activeSeasonFilter = 'All';

  const $ = (id) => document.getElementById(id);

  function showToast(msg) {
    const t = $('toastBar');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function parseSizes(raw) {
    return raw ? String(raw).split(/[,;|]+/).map(s => s.trim()).filter(Boolean) : [];
  }

  async function loadStore() {
    try {
      const res = await fetch(`${API_ENDPOINT}?type=products`, { mode: 'cors' });
      const data = await res.json();
      const rows = (data && data.success && data.products) ? data.products : (Array.isArray(data) ? data : []);

      ALL_PRODUCTS = rows.map(r => {
        const rawPrice = String(r.price || r['Price'] || '0').replace(/[₹,\s]/g, '').replace(/[^0-9.]/g, '');
        const imgs = [r.image, r.image2, r.image3, r.image4].filter(Boolean);
        return {
          id: String(r.id || r.name).toLowerCase().replace(/[^a-z0-9]/g, '-'),
          name: String(r.name || r['Product Name'] || '').trim(),
          price: parseFloat(rawPrice) || 0,
          image: imgs[0] || '',
          images: imgs,
          description: String(r.description || r['Description'] || '').trim(),
          season: String(r.season || r['Season'] || '').trim(),
          category: String(r.category || r['Category'] || '').trim(),
          subcategory: String(r.subcategory || r['Subcategory'] || '').trim(),
          size: String(r.size || r['Size'] || '').trim(),
          color: String(r.color || r['Color'] || '').trim(),
          length: String(r.length || r['Length'] || '').trim()
        };
      }).filter(p => p.name);

      renderSeasonChips();
      renderEdits();
    } catch (err) {
      showToast('Error syncing collection data.');
    }
  }

  function renderSeasonChips() {
    const seasons = ['All', ...new Set(ALL_PRODUCTS.map(p => p.season).filter(Boolean))].sort();
    $('seasonChipsBar').innerHTML = seasons.map(s => `
      <button class="f-pill ${activeSeasonFilter === s ? 'on' : ''}" data-season="${s}">${s}</button>
    `).join('');

    $('seasonChipsBar').querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        activeSeasonFilter = btn.dataset.season;
        renderSeasonChips();
        renderEdits();
      };
    });
  }

  function renderEdits() {
    const renderGrid = (seasonKeyword, gridId, countId) => {
      const filtered = ALL_PRODUCTS.filter(p => p.season.toLowerCase().includes(seasonKeyword.toLowerCase()));
      const cats = [...new Set(filtered.map(p => p.category).filter(Boolean))].sort();

      $(countId).textContent = `${cats.length} Collections`;
      $(gridId).innerHTML = cats.map(cat => {
        const match = filtered.find(p => p.category.toLowerCase() === cat.toLowerCase() && p.image);
        const count = filtered.filter(p => p.category.toLowerCase() === cat.toLowerCase()).length;
        return `
          <div class="edit-tile" onclick="window.openCategory('${cat}')">
            <img src="${match ? match.image : BLANK_SVG}" alt="${cat}" loading="lazy" onerror="this.src='${BLANK_SVG}'"/>
            <div class="edit-tile-meta">
              <div class="edit-tile-name">${cat}</div>
              <div class="edit-tile-count">${count} pieces</div>
            </div>
          </div>
        `;
      }).join('');
    };

    const winterSec = $('winterSection');
    const summerSec = $('summerSection');

    if (activeSeasonFilter === 'All' || activeSeasonFilter.toLowerCase().includes('winter')) {
      winterSec.style.display = 'block';
      renderGrid('Winter', 'winterGrid', 'winterCount');
    } else {
      winterSec.style.display = 'none';
    }

    if (activeSeasonFilter === 'All' || activeSeasonFilter.toLowerCase().includes('summer')) {
      summerSec.style.display = 'block';
      renderGrid('Summer', 'summerGrid', 'summerCount');
    } else {
      summerSec.style.display = 'none';
    }
  }

  window.openCategory = function(catName) {
    ACTIVE_CATEGORY = catName;
    $('homeEditorialView').style.display = 'none';
    $('catalogView').classList.add('visible');$('catalogHeaderTitle').textContent = catName;
    location.hash = encodeURIComponent(catName);

    renderCatalogGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function closeCategory() {
    ACTIVE_CATEGORY = null;
    $('catalogView').classList.remove('visible');$('homeEditorialView').style.display = 'block';
    location.hash = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderCatalogGrid() {
    let list = ALL_PRODUCTS.filter(p => p.category.toLowerCase() === ACTIVE_CATEGORY.toLowerCase());
    
    const q = $('searchInput').value.trim().toLowerCase();
    if (q) {
      list = list.filter(p => p.name.toLowerCase().includes(q) || p.subcategory.toLowerCase().includes(q) || p.color.toLowerCase().includes(q));
    }

    if (!list.length) {
      $('catalogGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--text-muted);text-transform:uppercase;font-size:11px;">No pieces found.</div>`;
      return;
    }

    $('catalogGrid').innerHTML = list.map(p => {
      const inBag = CART.some(item => item.id === p.id);
      return `
        <div class="kl-card" onclick="window.viewDetails('${p.id}')">
          <div class="card-media">
            <button class="card-bag-btn ${inBag ? 'in-bag' : ''}" onclick="event.stopPropagation(); window.toggleBag('${p.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            </button>
            <img src="${p.image || BLANK_SVG}" alt="${p.name}" loading="lazy" onerror="this.src='${BLANK_SVG}'"/>
          </div>
          <div class="card-body">
            <div class="card-cat">${p.subcategory || p.category}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-specs">${[p.color, p.length].filter(Boolean).join(' • ')}</div>
            <div class="card-finance">
              <span class="card-price">₹${p.price.toLocaleString('en-IN')}</span>
              <span class="card-size">${p.size || 'Free Size'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.viewDetails = function(id) {
    const p = ALL_PRODUCTS.find(item => item.id === id);
    if (!p) return;

    const imgs = p.images.length ? p.images : [p.image || BLANK_SVG];
    let curIdx = 0;

    const renderModal = () => `
      <div class="modal-img-pane">
        <div class="modal-main-img" onclick="window.openLightbox('${imgs[curIdx]}')">
          <img src="${imgs[curIdx]}" alt="${p.name}"/>
        </div>
        ${imgs.length > 1 ? `
          <div class="modal-thumbs">
            ${imgs.map((src, i) => `<div class="m-thumb ${i === curIdx ? 'on' : ''}" data-i="${i}"><img src="${src}"/></div>`).join('')}
          </div>
        ` : ''}
      </div>
      <div class="modal-info-pane">
        <div style="font-size:9px;color:var(--saffron);font-weight:600;letter-spacing:1px;text-transform:uppercase;">${p.season} • ${p.category}</div>
        <h3 style="font-family:var(--font-serif);font-size:22px;font-weight:600;">${p.name}</h3>
        <div class="modal-price">₹${p.price.toLocaleString('en-IN')}</div>
        ${p.description ? `<p style="font-size:12px;line-height:1.6;color:var(--text-muted);">${p.description}</p>` : ''}
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:auto;">
          <button class="btn-action-primary" onclick="window.toggleBag('${p.id}'); window.closeModal();">
            ${CART.some(item => item.id === p.id) ? 'Remove From Bag' : 'Add to Bag'}
          </button>
          <button class="btn-action-wa" onclick="window.orderWhatsApp('${p.id}')">Order Direct on WhatsApp</button>
        </div>
      </div>
    `;

    $('modalGridContent').innerHTML = renderModal();$('productModal').classList.add('open');

    document.querySelectorAll('.m-thumb').forEach(thumb => {
      thumb.onclick = () => {
        curIdx = parseInt(thumb.dataset.i, 10);
        $('modalGridContent').innerHTML = renderModal();
      };
    });
  };

  window.closeModal = () => $('productModal').classList.remove('open');$('modalCloseBtn').onclick = window.closeModal;
  $('productModal').onclick = (e) => { if (e.target ===$('productModal')) window.closeModal(); };

  window.openLightbox = (src) => {
    $('lightboxImg').src = src;
    $('lightboxView').classList.add('open');
  };
  $('lightboxCloseBtn').onclick = () =>$('lightboxView').classList.remove('open');

  window.toggleBag = function(id) {
    const p = ALL_PRODUCTS.find(item => item.id === id);
    if (!p) return;
    const idx = CART.findIndex(item => item.id === id);
    if (idx > -1) {
      CART.splice(idx, 1);
      showToast(`Removed ${p.name}`);
    } else {
      CART.push(p);
      showToast(`Added ${p.name} to Bag`);
    }
    updateBagTray();
    if (ACTIVE_CATEGORY) renderCatalogGrid();
  };

  function updateBagTray() {
    $('cartCountBadge').textContent = CART.length;
    const list = $('cartItemsList');
    const foot = $('cartFootBox');

    if (!CART.length) {
      list.innerHTML = `<div style="text-align:center;padding:50px 20px;font-size:11px;color:var(--text-muted);text-transform:uppercase;">Your bag is empty.</div>`;
      foot.style.display = 'none';
      return;
    }

    foot.style.display = 'flex';
    list.innerHTML = CART.map(p => `
      <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;">
        <div style="width:52px;height:64px;border-radius:var(--radius);overflow:hidden;background:#eee;"><img src="${p.image || BLANK_SVG}"/></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>
          <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;margin-top:2px;">₹${p.price.toLocaleString('en-IN')}</div>
          <span style="font-size:9px;color:var(--ruby);cursor:pointer;font-weight:600;text-transform:uppercase;" onclick="window.toggleBag('${p.id}')">Remove</span>
        </div>
      </div>
    `).join('');

    $('cartTotalSum').textContent = `₹${CART.reduce((sum, item) => sum + item.price, 0).toLocaleString('en-IN')}`;
  }

  window.orderWhatsApp = function(id) {
    const p = ALL_PRODUCTS.find(item => item.id === id);
    if (!p) return;
    const msg = `Hi! I would like to order *${p.name}* (₹${p.price.toLocaleString('en-IN')}). Please confirm availability!`;
    window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  $('whatsappCheckoutBtn').onclick = () => {
    if (!CART.length) return;
    const clientName = $('customerNameInput').value.trim() || 'Valued Customer';
    let msg = `🧣 *NEW ORDER INQUIRY — THE KASHMIRI LIBAS*\nClient: ${clientName}\n\n`;
    CART.forEach((p, i) => {
      msg += `${i + 1}. *${p.name}* — ₹${p.price.toLocaleString('en-IN')}\n`;
    });
    const total = CART.reduce((sum, item) => sum + item.price, 0);
    msg += `\n*Total Estimate: ₹${total.toLocaleString('en-IN')}*\nPlease confirm availability!`;
    window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  $('brandHomeTrigger').onclick = closeCategory;
  $('btnBackHome').onclick = closeCategory;
  $('btnOpenCart').onclick = () => $('cartOverlay').classList.add('open');$('cartCloseBtn').onclick = () => $('cartOverlay').classList.remove('open');$('cartOverlay').onclick = (e) => { if (e.target === $('cartOverlay'))$('cartOverlay').classList.remove('open'); };

  $('searchInput').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (ACTIVE_CATEGORY) {
      renderCatalogGrid();
    } else if (q.length > 0) {
      // Direct quick search activation if user types on home screen
      const matched = ALL_PRODUCTS.find(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      if (matched) openCategory(matched.category);
    }
  };

  loadStore();
})();
</script>
</body>
</html>
